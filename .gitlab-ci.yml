stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE
  DOCKER_TAG: $CI_COMMIT_SHORT_SHA
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  DOCKER_LATEST_TAG: latest

# Включаем Docker-in-Docker
services:
  - docker:dind

before_script:
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

build:
  stage: build
  image: docker:latest
  script:
    - docker pull $DOCKER_IMAGE:$DOCKER_LATEST_TAG || true
    # Сборка Docker образа
    - docker build
      --cache-from $DOCKER_IMAGE:$DOCKER_LATEST_TAG
      --build-arg NODE_ENV=production
      --build-arg BUILDKIT_INLINE_CACHE=1
      -t $DOCKER_IMAGE:$DOCKER_TAG
      -t $DOCKER_IMAGE:$DOCKER_LATEST_TAG
      .
    # Пуш образов в GitLab Container Registry
    - docker push $DOCKER_IMAGE:$DOCKER_TAG
    - docker push $DOCKER_IMAGE:$DOCKER_LATEST_TAG

# Дополнительный stage для deployment (опционально)
deploy:
  stage: deploy
  tags:
    - banana-test
  script:
    - echo "Deploying application..."
    - echo "Image $DOCKER_IMAGE:$DOCKER_TAG has been built and pushed"
    - cd /projects/club-ai/backend
    - git pull
    - docker pull $DOCKER_IMAGE:$DOCKER_TAG
    - docker pull $DOCKER_IMAGE:$DOCKER_LATEST_TAG
    - docker compose up -d
  only:
    - main