stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE
  DOCKER_TAG: $CI_COMMIT_SHORT_SHA
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  DOCKER_LATEST_TAG: latest

# Включаем Docker-in-Docker
services:
  - docker:dind

build:
  stage: build
  image: docker:latest
  before_script:
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull $DOCKER_IMAGE:$DOCKER_LATEST_TAG || true
    - docker pull $DOCKER_IMAGE:$DOCKER_TAG || true
    # Сборка Docker образа
    - |
      if [ "$CI_COMMIT_BRANCH" = "master" ]; then
        DOCKER_TAGS="-t $DOCKER_IMAGE:$DOCKER_TAG -t $DOCKER_IMAGE:$DOCKER_LATEST_TAG"
      else
        DOCKER_TAGS="-t $DOCKER_IMAGE:$DOCKER_TAG"
      fi
      docker build \
        --cache-from $DOCKER_IMAGE:$DOCKER_LATEST_TAG \
        --cache-from $DOCKER_IMAGE:$DOCKER_TAG \
        --build-arg NODE_ENV=production \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        $DOCKER_TAGS \
        .
    # Пуш образов в GitLab Container Registry
    - docker push $DOCKER_IMAGE:$DOCKER_TAG
    - |
      if [ "$CI_COMMIT_BRANCH" = "master" ]; then
        docker push $DOCKER_IMAGE:$DOCKER_LATEST_TAG
      fi

deploy:
  stage: deploy
  image: curlimages/curl:8.5.0
  needs: ["build"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - >
      curl --fail --show-error --silent
      -X POST "https://s3.alexlnos.ru/api/deploy/A1n44eDucW8p-bW7c5ibV"
